<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>二次元场景设计器（V2）</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>二次元场景设计器 V2</h1>
      <p class="subtitle">新增图层开关、角色立绘叠加、分辨率预设导出</p>

      <label>模板</label>
      <select id="preset"></select>

      <label>输出分辨率</label>
      <select id="resolution">
        <option value="1600x900">桌面 16:9 (1600x900)</option>
        <option value="1920x1080">桌面 16:9 (1920x1080)</option>
        <option value="1080x1920">手机 9:16 (1080x1920)</option>
        <option value="2048x1536">平板 4:3 (2048x1536)</option>
      </select>

      <div class="checks">
        <label><input type="checkbox" id="layer-bg" checked> 背景层（天空）</label>
        <label><input type="checkbox" id="layer-city" checked> 中景层（建筑）</label>
        <label><input type="checkbox" id="layer-fx" checked> 特效层（雨/星）</label>
        <label><input type="checkbox" id="layer-glow" checked> 光晕层（氛围）</label>
      </div>

      <label>时间</label>
      <input id="time" type="range" min="0" max="100" value="60" />
      <label>天气强度</label>
      <input id="weather" type="range" min="0" max="100" value="20" />
      <label>风格强度</label>
      <input id="style" type="range" min="0" max="100" value="40" />
      <label>景深（模糊）</label>
      <input id="depth" type="range" min="0" max="20" value="4" />

      <label>角色立绘</label>
      <input id="character-file" type="file" accept="image/*" />
      <label>角色大小</label>
      <input id="character-scale" type="range" min="10" max="90" value="45" />
      <label>角色横向位置</label>
      <input id="character-x" type="range" min="0" max="100" value="50" />

      <div class="row">
        <button id="randomize">随机场景</button>
        <button id="download">下载壁纸</button>
      </div>
    </section>

    <section class="canvas-wrap">
      <canvas id="scene" width="1600" height="900"></canvas>
    </section>
  </main>

  <script src="scene.js"></script>
</body>
</html>
